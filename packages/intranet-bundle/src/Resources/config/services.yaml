services:
  _defaults:
    autowire: true
    autoconfigure: true

  _instanceof:
    App\Domain\Dashboard\WidgetProviderInterface:
      tags: ["app.dashboard.widget_provider"]
    App\Domain\Dashboard\WidgetDataProviderInterface:
      tags: ["app.dashboard.widget_data_provider"]
    App\Domain\Dashboard\DashboardDefinitionInterface:
      tags:
        - app.dashboard.definition
    App\Service\Email\AbstractEmailDefinition:
      tags: [ 'app.email_definition' ]
    IntranetBundle\Commission\Contract\CommissionStrategyInterface:
      tags: [ 'intranet.commission.strategy' ]

  IntranetBundle\Commission\Contract\CommissionServiceInterface: '@IntranetBundle\Commission\Service\CommissionService'
  IntranetBundle\Commission\Contract\CommissionDataLoaderInterface: '@IntranetBundle\Commission\Service\CommissionDataLoader'
  IntranetBundle\Commission\Contract\CommissionStrategyResolverInterface: '@IntranetBundle\Commission\Service\CommissionStrategyResolver'

  IntranetBundle\:
    resource: "../../"
    exclude:
      - "../../Entity/"
      - "../../IntranetBundle.php"
