parameters:
  # Médias UniFolio stockés hors webroot : servis uniquement via les contrôleurs (voters).
  unifolio.media_dir: '%kernel.project_dir%/var/unifolio/media'
  unifolio.media_max_size: 52428800 # 50 Mo

services:
  _defaults:
    autowire: true
    autoconfigure: true
    bind:
      string $unifolioMediaDir: '%unifolio.media_dir%'
      int $unifolioMediaMaxSize: '%unifolio.media_max_size%'

  _instanceof:
    App\Domain\Dashboard\WidgetProviderInterface:
      tags: [ 'app.dashboard.widget_provider' ]
    App\Domain\Dashboard\WidgetDataProviderInterface:
      tags: [ 'app.dashboard.widget_data_provider' ]
    App\Security\PermissionProviderInterface:
      tags: [ 'app.permission_provider' ]
    App\Service\Email\AbstractEmailDefinition:
      tags: [ 'app.email_definition' ]

  UnifolioBundle\:
    resource: '../../'
    exclude:
      - '../../Entity/'
      - '../../Enum/'
      - '../../DependencyInjection/'
      - '../../Service/Media/StoredMedia.php'
      - '../../Service/Media/MediaValidationException.php'
      - '../../Service/Media/EmbedPolicy.php'
      - '../../Service/Trace/UnifolioValidationException.php'
      - '../../UnifolioBundle.php'

  UnifolioBundle\Service\Media\MediaStorageInterface: '@UnifolioBundle\Service\Media\LocalMediaStorage'
