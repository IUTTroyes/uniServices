parameters:
  # Rapports de stage déposés par les étudiants (hors webroot) ; STAGE_RAPPORT_DIR pour un volume persistant dédié.
  stage.rapport_dir_defaut: '%kernel.project_dir%/var/stage/rapports'
  stage.rapport_dir: '%env(default:stage.rapport_dir_defaut:STAGE_RAPPORT_DIR)%'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  _instanceof:
    App\Security\PermissionProviderInterface:
      tags: [ 'app.permission_provider' ]
    App\Service\Email\AbstractEmailDefinition:
      tags: [ 'app.email_definition' ]

  StageBundle\:
    resource: '../../'
    exclude:
      - '../../Entity/'
      - '../../StageBundle.php'
