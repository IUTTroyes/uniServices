name: CI-Back

on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - 'packages/**'
      - '.github/workflows/CI-back.yml'
  pull_request:
    branches: [main]
    paths:
      - 'back/**'
      - 'packages/**'
      - '.github/workflows/CI-back.yml'

permissions:
  contents: read

concurrency:
  group: ci-back-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-back:
    name: Symfony / PHP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, iconv, simplexml
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Validate Symfony container
        run: php bin/console lint:container

      - name: Validate Doctrine mapping
        run: php bin/console doctrine:schema:validate --skip-sync

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon --memory-limit=1G

      - name: Run PHPUnit
        if: ${{ hashFiles('back/phpunit.xml', 'back/phpunit.xml.dist', 'back/tests/**/*.php') != '' }}
        run: |
          if [ ! -x vendor/bin/phpunit ]; then
            echo "::error::PHPUnit tests/configuration exist but phpunit is not installed."
            exit 1
          fi
          vendor/bin/phpunit
