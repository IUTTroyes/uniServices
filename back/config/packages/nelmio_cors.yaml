nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'X-Requested-With', 'X-Annee-Universitaire', 'X-Contexte-Annuel']
        expose_headers: ['Link', 'X-Annee-Universitaire', 'X-Contexte-Annuel']
        allow_credentials: true
        max_age: 3600
    paths:
        '^/': null
