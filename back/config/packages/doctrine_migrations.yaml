doctrine_migrations:
    migrations_paths:
        # namespace is arbitrary but should be different from App\Migrations
        # as migrations classes should NOT be autoloaded
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
    enable_profiler: false
    # Les packages ajoutent leur dossier migrations/ (App\Extension\AbstractPackageExtension).
    services:
        'Doctrine\Migrations\Version\Comparator': App\Doctrine\MigrationsComparator
